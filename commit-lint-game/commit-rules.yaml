version: 1

rules:
  - name: conventional-commit
    pattern: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9._/-]+\))?: .+'
    flags: []
    message: "Commit must follow Conventional Commits format: type(scope): description"

  - name: no-empty-description
    pattern: '^.+: \S.+$'
    flags: []
    message: "Commit description cannot be empty"

  - name: ticket-reference
    pattern: '\b(PROJ|BUG)-[0-9]+\b'
    flags: []
    message: "Commit must reference a ticket (e.g. PROJ-123)"

  - name: max-subject-length
    pattern: '^.{1,72}(?:\n|$)'
    flags: []
    message: "Commit subject must be no longer than 72 characters"